version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: campuspredict-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-campuspredict-flask-jwt-secret-key-2026}
      - DATABASE_PATH=/app/backend/campuspredict.db
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=False
    volumes:
      # Persistent storage: binds host SQLite DB and trained ML models
      - ./backend/campuspredict.db:/app/backend/campuspredict.db
      - ./backend/saved_models:/app/backend/saved_models
      - ./backend/uploads:/app/backend/uploads
      - ./backend/reports:/app/backend/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - campuspredict-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: campuspredict-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      # Connects to internal Docker service name, not localhost
      - API_BASE_URL=http://backend:5000/api
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - campuspredict-net

networks:
  campuspredict-net:
    driver: bridge
